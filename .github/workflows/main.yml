name: Daily LeetCode Review

on:
  schedule:
    # Runs daily; the preflight step applies the configured UTC weekend policy
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check review day
        id: preflight
        run: python scripts/review_day_preflight.py --github-output "$GITHUB_OUTPUT"

      - name: Run review script
        if: steps.preflight.outputs.should_run == 'true'
        run: python scripts/review.py

      - name: Format daily review issue
        if: steps.preflight.outputs.should_run == 'true'
        id: formatter
        run: |
          TODAY="$(date -u '+%Y-%m-%d')"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          python scripts/issue_formatter.py \
            --today "$TODAY" \
            --body-file "$RUNNER_TEMP/daily-review.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or update daily review issue
        if: steps.preflight.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="📚 Daily LeetCode Review — ${{ steps.formatter.outputs.today }}"

          EXISTING=$(
            gh issue list --state open --limit 1000 --json number,title |
              jq -r --arg title "$ISSUE_TITLE" \
                '.[] | select(.title == $title) | .number' |
              head -n 1
          )

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$RUNNER_TEMP/daily-review.md"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/daily-review.md"
            echo "Created new issue: $ISSUE_TITLE"
          fi

      - name: Close older daily issues on an empty day
        if: steps.preflight.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/daily_issue_lifecycle.py \
            --repo "${{ github.repository }}" \
            --today "${{ steps.formatter.outputs.today }}" \
            --has-reviews "${{ steps.formatter.outputs.has_reviews }}" \
            --paused "${{ steps.formatter.outputs.paused }}"

      - name: Commit updated review metadata
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .leetcode-review/reviews.json
          # Only commit when there are actual changes
          git diff --cached --quiet || git commit -m "chore: update review metadata [skip ci]"
          git push
