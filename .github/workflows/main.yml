name: Daily LeetCode Review

on:
  schedule:
    # Runs at 5:00 AM UTC, Monday through Friday (weekdays only)
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run review script
        run: python scripts/review.py

      - name: Create or update daily review issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="📚 Daily LeetCode Review — $(date -u '+%Y-%m-%d')"
          ISSUE_BODY=$(python scripts/issue_formatter.py)

          # Check whether an open issue with this title already exists
          EXISTING=$(gh issue list --state open --search "$ISSUE_TITLE" --json number --jq '.[0].number // ""')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$ISSUE_BODY"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY"
            echo "Created new issue: $ISSUE_TITLE"
          fi

      - name: Commit updated review metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .leetcode-review/reviews.json
          # Only commit when there are actual changes
          git diff --cached --quiet || git commit -m "chore: update review metadata [skip ci]"
          git push

