name: Daily LeetCode Review

on:
  schedule:
    # Runs daily at 05:00 UTC; the preflight step picks the review day in the
    # configured timezone (UTC by default) and applies the weekend policy
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    # Shared with the comment workflow so review metadata is updated by one run
    # at a time. queue: max keeps every waiting run instead of cancelling them.
    concurrency:
      group: review-metadata
      cancel-in-progress: false
      queue: max

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the branch tip when the job starts so a run that waited in
          # the concurrency queue sees earlier runs' updates
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check review day
        id: preflight
        run: python scripts/review_day_preflight.py --github-output "$GITHUB_OUTPUT"

      - name: Run review script
        if: steps.preflight.outputs.should_run == 'true'
        env:
          TODAY: ${{ steps.preflight.outputs.today }}
        run: python scripts/review.py --today "$TODAY"

      - name: Format daily review issue
        if: steps.preflight.outputs.should_run == 'true'
        id: formatter
        env:
          TODAY: ${{ steps.preflight.outputs.today }}
        run: |
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          python scripts/issue_formatter.py \
            --today "$TODAY" \
            --body-file "$RUNNER_TEMP/daily-review.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or update daily review issue
        if: steps.preflight.outputs.should_run == 'true'
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="📚 Daily LeetCode Review — ${{ steps.formatter.outputs.today }}"

          EXISTING=$(
            gh issue list --state open --limit 1000 --json number,title |
              jq -r --arg title "$ISSUE_TITLE" \
                '.[] | select(.title == $title) | .number' |
              head -n 1
          )

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file "$RUNNER_TEMP/daily-review.md"
            echo "Updated existing issue #$EXISTING"
            ISSUE_NUMBER="$EXISTING"
          else
            ISSUE_URL=$(gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/daily-review.md")
            echo "Created new issue: $ISSUE_TITLE ($ISSUE_URL)"
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      # Runs before closing older issues so a failure there cannot drop the metadata
      - name: Commit updated review metadata
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .leetcode-review/reviews.json
          # Only commit when there are actual changes
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update review metadata [skip ci]"
          # Rebase onto commits pushed since checkout and retry rejected pushes
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the updated review metadata."
          exit 1

      - name: Close older daily issues
        if: steps.preflight.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/daily_issue_lifecycle.py \
            --repo "${{ github.repository }}" \
            --today "${{ steps.formatter.outputs.today }}" \
            --has-reviews "${{ steps.formatter.outputs.has_reviews }}" \
            --paused "${{ steps.formatter.outputs.paused }}" \
            --current-issue "${{ steps.issue.outputs.number }}"
