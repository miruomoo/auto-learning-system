name: Daily LeetCode Review

on:
  schedule:
    # Runs every day at 9:00 AM UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run review script
        run: python scripts/review.py

      - name: Commit updated review metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .leetcode-review/reviews.json
          # Only commit when there are actual changes
          git diff --cached --quiet || git commit -m "chore: update review metadata [skip ci]"
          git push
