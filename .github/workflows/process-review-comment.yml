name: Process Review Comment

on:
  issue_comment:
    types: [created]

jobs:
  process:
    # Only run on comments that look like review or pause commands
    if: (contains(github.event.comment.body, 'review') || contains(github.event.comment.body, 'pause')) && github.event.issue.state == 'open'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process review comment
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python scripts/process_review_comment.py \
            --issue-number "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}"

      - name: Commit updated review metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .leetcode-review/reviews.json .leetcode-review/config.json
          git diff --cached --quiet || git commit -m "chore: update review metadata [skip ci]"
          git push

      - name: Close issue if all problems reviewed
        if: steps.review.outputs.all_reviewed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --comment "🎉 All problems reviewed for today! Closing this issue."
